[project]
name = "pyfetch"
version = "0.1.0"
description = "A fast, cross-platform system info dashboard built with Rich"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "psutil>=7.2.2",
    "rich>=15.0.0",
    "wmi>=1.5.1,",
]

[project.optional-dependencies]
nvidia = [
    "nvidia-ml-py>=12.535.133",
]

